<!-- Noxun Engine — okno ŠTÚDIO (ST-1a): navigácia + sekcia Kusovník.
     Vanilla JS, žiadne CDN, slovensky. READ-ONLY nad modelom — klik iba vyberá
     entity; do .skp sa odtiaľto nezapisuje nič a nevzniká krok Späť.
     Dáta: NX.setStudio push zo studio_dialog.rb (čísla počíta ProductionCore —
     to isté jadro, aké číta okno Výroba).
     Vizuálna referencia: SYSTEM/zdroje/ui20/mockup_studio.html -->
<meta charset="utf-8">
<link rel="stylesheet" href="css/panel.css?v=0.7.36">
<style>
  /* Štýly sú ZÁMERNE inline v studio.html (rovnaký dôvod ako production.html):
     panel.css je zdieľaný s Inspectorom a rozloženie tohto okna doňho nepatrí.
     Farby VÝHRADNE cez --nx-* tokeny (docs/UI_DIZAJN.md). */
  html, body { height: 100%; }
  body { padding: 0; display: flex; flex-direction: column; overflow: hidden; }

  .studio { flex: 1; display: flex; min-height: 0; }

  /* ---------- navigácia ---------- */
  .snav { flex: 0 0 208px; background: var(--nx-bg); border-right: 1px solid var(--nx-border);
          padding: 8px 6px; overflow: auto; transition: flex-basis .12s; }
  .studio.navmini .snav { flex-basis: 48px; }
  .studio.navmini .snav .sgrp,
  .studio.navmini .snav .navitem span,
  .studio.navmini .snav .navitem .nbridge { display: none; }
  .studio.navmini .navitem { justify-content: center; padding: 7px 0; }
  .sgrp { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
          color: var(--nx-ink-faint); padding: 9px 8px 3px; }
  .sgrp:first-child { padding-top: 2px; }
  .navitem { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 8px; margin: 1px 0;
             border: 0; border-radius: 6px; background: none; cursor: pointer; font: inherit;
             font-size: 12.5px; font-weight: 400; color: var(--nx-ink-strong); text-align: left; }
  .navitem:hover { background: var(--nx-select-bg-soft); }
  .navitem.on { background: var(--nx-select-bg); color: var(--nx-select); font-weight: 600;
                box-shadow: inset 3px 0 0 var(--nx-select); }
  .navitem .ic { width: 15px; height: 15px; color: var(--nx-ink-muted); flex: 0 0 15px; }
  .navitem.on .ic { color: var(--nx-select); }
  .navitem span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Premostenie = obsah je (zatiaľ) v inom okne. Šípka to prizná na prvý pohľad,
     tooltip povie, v ktorej dávke sa presunie sem. */
  .navitem .nbridge { flex: 0 0 auto; font-style: normal; font-size: 11px; color: var(--nx-ink-faint); }
  .navitem[aria-disabled="true"] { color: var(--nx-ink-faint); cursor: not-allowed; }
  .navitem[aria-disabled="true"] .ic { color: var(--nx-ink-faint); }
  .navitem[aria-disabled="true"]:hover { background: none; }
  .navfoot { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--nx-border-soft); }

  /* ---------- telo sekcie ---------- */
  .sbody { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--nx-surface); }
  .sechead { display: flex; align-items: baseline; gap: 8px; padding: 9px 12px;
             border-bottom: 1px solid var(--nx-border); background: var(--nx-bg); }
  .sechead h2 { font-size: 14px; margin: 0; color: var(--nx-ink-title); font-weight: 700; }
  .sechead .sechint { font-size: 11px; color: var(--nx-ink-soft); }
  .sechead .secmodel { margin-left: auto; font-size: 11px; color: var(--nx-ink-faint); white-space: nowrap; }
  .sectools { display: flex; align-items: center; gap: 6px; padding: 8px 12px;
              border-bottom: 1px solid var(--nx-border-soft); flex-wrap: wrap; position: relative; }
  .sectools .spacer { flex: 1; }
  .sectools .primary { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; }
  .sectools .ghostbtn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; }
  .sectools .ghostbtn .ic, .sectools .primary .ic { width: 14px; height: 14px; }
  /* D-78: viditeľné, ale neaktívne — dôvod je v tooltipe, nie v tichu. */
  .sectools [aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
  .secscroll { flex: 1; overflow: auto; padding: 10px 12px 20px; }

  .searchbox { display: flex; align-items: center; gap: 6px; border: 1px solid var(--nx-border-strong);
               border-radius: 6px; padding: 4px 8px; background: var(--nx-surface); min-width: 180px; }
  .searchbox input { border: 0; outline: 0; font: inherit; font-size: 12px; flex: 1;
                     background: transparent; min-width: 0; }
  .searchbox .ic { width: 14px; height: 14px; color: var(--nx-ink-faint); }

  /* Názov projektu a merge 18+36 — SERVER je autorita (audit #1); okno posiela
     iba hodnotu a po zápise dostane čerstvý payload (rovnako ako okno Výroba). */
  .prjbox { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--nx-ink-label); }
  .prjbox input { font: inherit; font-size: 12px; padding: 4px 8px; width: 150px;
                  border: 1px solid var(--nx-border-strong); border-radius: 6px;
                  background: var(--nx-surface); color: var(--nx-ink); }
  .mergebox { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
              color: var(--nx-ink-label); white-space: nowrap; cursor: pointer; }
  .mergebox input { accent-color: var(--nx-select); }

  /* ---------- pohľady sekcie (Š4) ---------- */
  .bomviews { display: flex; border: 1px solid var(--nx-border-strong); border-radius: 6px;
              overflow: hidden; margin-right: 4px; }
  .bomvw { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; border: 0;
           border-radius: 0; cursor: pointer; background: var(--nx-surface); color: var(--nx-ink-muted); }
  .bomvw + .bomvw { border-left: 1px solid var(--nx-border); }
  .bomvw:hover { background: var(--nx-select-bg-soft); }
  .bomvw.on { background: var(--nx-select-bg); color: var(--nx-select); }

  /* ---------- Š2: voliteľné stĺpce (overlay, nie ďalší riadok layoutu) ---------- */
  .colmenu { position: absolute; top: calc(100% - 2px); right: 12px; z-index: 60; width: 196px;
             background: var(--nx-surface); border: 1px solid var(--nx-border); border-radius: 6px;
             box-shadow: 0 6px 18px var(--nx-modal-shadow); padding: 5px; }
  .colmenu .mgrp { font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
                   color: var(--nx-ink-faint); padding: 3px 6px; }
  .colmenu label { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px;
                   font-size: 12px; cursor: pointer; color: var(--nx-ink); }
  .colmenu label:hover { background: var(--nx-select-bg-soft); }
  .colmenu label.fixed { color: var(--nx-ink-faint); cursor: not-allowed; }
  .colmenu input { width: 14px; height: 14px; margin: 0; accent-color: var(--nx-select); }

  /* ---------- Š1: skupiny podľa materiálu ---------- */
  .grp { border: 1px solid var(--nx-border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
  .grphead { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px;
             background: var(--nx-surface-th); border: 0; border-bottom: 1px solid var(--nx-border);
             border-radius: 0; cursor: pointer; font: inherit; text-align: left; }
  .grp.closed .grphead { border-bottom: 0; }
  .grphead .chev { width: 6px; height: 6px; border-right: 2px solid var(--nx-ink-faint);
                   border-bottom: 2px solid var(--nx-ink-faint); transform: rotate(45deg);
                   flex: 0 0 6px; position: relative; top: -2px; transition: transform .12s; }
  .grp.closed .grphead .chev { transform: rotate(-45deg); top: 0; }
  .grphead .sw { width: 16px; height: 16px; border-radius: 6px; flex: 0 0 16px;
                 border: 1px solid var(--nx-border-strong); background: var(--nx-surface-sunken); }
  .grphead .gname { font-weight: 600; font-size: 12.5px; color: var(--nx-ink-strong); }
  .grphead .gsub { color: var(--nx-ink-muted); font-size: 11px; }
  .grphead .gsum { margin-left: auto; font-size: 11.5px; color: var(--nx-ink-muted);
                   font-variant-numeric: tabular-nums; }
  .grphead .gsum b { color: var(--nx-ink-strong); }
  .grp.closed .bomtab { display: none; }

  /* ---------- tabuľka ---------- */
  .bomtab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .bomtab.flat { border: 1px solid var(--nx-border); border-radius: 6px; overflow: hidden;
                 border-collapse: separate; border-spacing: 0; }
  .bomtab th { background: var(--nx-surface-th); color: var(--nx-ink-label); font-weight: 600;
               font-size: 11px; text-align: left; padding: 5px 8px;
               border-bottom: 1px solid var(--nx-border); white-space: nowrap; }
  .bomtab td { padding: 4px 8px; border-bottom: 1px solid var(--nx-border-soft); color: var(--nx-ink); }
  .bomtab tr:last-child td { border-bottom: 0; }
  .bomtab th.num, .bomtab td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bomtab th.acth, .bomtab td.acth { width: 56px; padding-left: 2px; padding-right: 6px; }
  .bomtab tbody tr { cursor: pointer; }
  .bomtab tbody tr:hover { background: var(--nx-select-bg-soft); }
  .bomtab tbody tr:hover .rowact { opacity: 1; }
  td.absc { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--nx-ink-muted); cursor: help; }
  .estfb { color: var(--nx-warn-fg); }
  .cellsw { display: inline-block; width: 13px; height: 13px; border-radius: 3px;
            border: 1px solid var(--nx-border-strong); vertical-align: -2px; margin-right: 7px; }
  .wtagchip { display: inline-block; font-size: 9.5px; font-weight: 700; color: var(--nx-warnchip-fg);
              border: 1px solid var(--nx-warnchip-border); background: var(--nx-warn-bg-soft);
              border-radius: 9px; padding: 0 6px; vertical-align: 1px; }

  /* Š3: hover akcie riadku — oko (označ) a ceruzka (označ + Inspector dopredu).
     Tretia akcia „detail/traceability" tu ZÁMERNE nie je (príde s D-94). */
  .rowact { display: flex; gap: 3px; opacity: 0; transition: opacity .1s; justify-content: flex-end; }
  .rowact button { width: 22px; height: 20px; padding: 0; border: 1px solid var(--nx-border);
                   border-radius: 6px; background: var(--nx-surface); color: var(--nx-ink-muted);
                   cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .rowact button:hover { color: var(--nx-select); border-color: var(--nx-select); }
  .rowact .ic { width: 13px; height: 13px; }

  /* ---------- ŠT-1b: sekcia KONTROLA (Š8–Š11) ----------
     Semaforové chipy sú KLIKATEĽNÉ FILTRE (červený/oranžový), zelený je
     informačný. Riadok nálezu je karta, nie tabuľka — nálezy majú rôzne dlhé
     texty a akcie vpravo. Farby VÝHRADNE cez --nx-* tokeny.
     Prepínače lišty (.ecbtn/.gcbtn/.echk/.cornerzone) a rozbaľovacie okno
     (.ecmenu) sú v ZDIEĽANOM css/panel.css — kreslí ich ten istý komponent
     ako v raile Inspectora, takže tu ich kópia byť NESMIE. */
  .semafor { display: flex; gap: 8px; margin-bottom: 10px; }
  /* UI-01/O3: komponentový radius je v celom plugine 6 px (mockup mal 7). */
  .schip { flex: 1; border: 1px solid var(--nx-border); border-radius: 6px; padding: 8px 10px;
           background: var(--nx-surface); display: flex; align-items: center; gap: 8px;
           font: inherit; text-align: left; }
  button.schip { cursor: pointer; }
  button.schip:hover { border-color: var(--nx-select); background: var(--nx-select-bg-soft); }
  .schip.on { border-color: var(--nx-select); background: var(--nx-select-bg);
              box-shadow: 0 0 0 1px var(--nx-select); }
  .schip .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; }
  .schip .n { font-size: 19px; font-weight: 700; color: var(--nx-ink-title); line-height: 1; }
  .schip .t { font-size: 11px; color: var(--nx-ink-muted); }
  .schip.s-red .dot { background: var(--nx-state-red); }
  .schip.s-orange .dot { background: var(--nx-state-orange); }
  .schip.s-green .dot { background: var(--nx-state-green); }
  .hint.ctrlfilter { margin: -4px 0 8px; }

  .ctrlrow { display: flex; align-items: center; gap: 9px; padding: 7px 9px;
             border: 1px solid var(--nx-border); border-radius: 6px; margin-bottom: 6px;
             background: var(--nx-surface); cursor: pointer; font-size: 12.5px; }
  .ctrlrow:hover { background: var(--nx-select-bg-soft); border-color: var(--nx-select); }
  .ctrlrow .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
  .ctrlrow.ctrl-red .dot { background: var(--nx-state-red); }
  .ctrlrow.ctrl-orange .dot { background: var(--nx-state-orange); }
  .ctrlrow .msg { flex: 1; min-width: 0; color: var(--nx-ink); }
  .ctrlrow .where { color: var(--nx-ink-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .ctrlrow .rowact { display: flex; gap: 3px; opacity: 1; }
  .ctrlrow .goact { width: 24px; height: 22px; padding: 0; border: 1px solid var(--nx-border);
                    border-radius: 6px; background: var(--nx-surface); color: var(--nx-ink-muted);
                    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .ctrlrow .goact:hover { color: var(--nx-select); border-color: var(--nx-select); }
  .ctrlrow .goact .ic { width: 13px; height: 13px; }

  /* Š11: živé počty pri navigačnej položke Kontrola (v zbalenej navigácii sa
     skryjú spolu s názvom — na 48 px ikonu sa dve čísla nezmestia). */
  .nbadge { display: inline-flex; gap: 3px; align-items: center; flex: 0 0 auto; }
  .nbadge i { font-style: normal; font-size: 10px; font-weight: 700; border-radius: 9px;
              padding: 0 5px; line-height: 15px; }
  .nbadge i.r { background: var(--nx-err-bg); color: var(--nx-err-fg); border: 1px solid var(--nx-err-border); }
  .nbadge i.o { background: var(--nx-warn-bg-soft); color: var(--nx-wbadge-fg);
                border: 1px solid var(--nx-warnchip-border); }
  .studio.navmini .snav .nbadge { display: none; }

  /* Text vedľa prepínačov lišty (počty zo servera), veta pre starý SketchUp
     a poznámka na konci lišty — bez toho by boli v základnej veľkosti písma
     a ťahali by oko viac než samotné prepínače. */
  .sectools .ecinfo { font-size: 11.5px; color: var(--nx-ink-muted); }
  .sectools .ecoff { font-size: 11.5px; color: var(--nx-ink-faint); }
  .sectools .sechint { font-size: 11px; color: var(--nx-ink-soft); }

  /* ---------- ŠT-1c PR A: sekcia NÁKUP KOVANIA (Š7) ----------
     Štýly sa PRESUNULI 1:1 z production.html (tab Kovanie zanikol) — Š7
     zakazuje redizajn, ten príde až s blokom KOVANIE. Jediná úprava: pevné
     hex farby pôvodného tabu sú prepísané na --nx-* tokeny (trvalé pravidlo
     docs/UI_DIZAJN.md; okno má dve témy a hex by v téme Lucia svietil). */
  .hwsec { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px;
           font-weight: 700; font-size: 12.5px; color: var(--nx-ink-strong); }
  .hwsec-warn span { color: var(--nx-warn-fg); }
  .hwbanner { background: var(--nx-warn-bg); border: 1px solid var(--nx-warnchip-border);
              border-radius: 6px; padding: 6px 10px; margin: 4px 0; font-size: 12px;
              color: var(--nx-warn-fg); }
  .bomtab tr.hwcat td { background: var(--nx-surface-th); font-weight: 700; font-size: 11.5px;
                        color: var(--nx-ink-label); padding: 2px 6px; }
  .bomtab tr.hwmiss td { color: var(--nx-warn-fg); }
  .bomtab tr.hwsum td { font-weight: 600; border-top: 2px solid var(--nx-border-strong); }
  /* Review P3 — ŽIADNA FALOŠNÁ AFORDANCIA. `.bomtab tbody tr` má kvôli
     Kusovníku ruku aj hover, lenže v tejto sekcii je klikateľný LEN riadok
     generiky (`.hwrow`, označí vlastníka v modeli). Kategórie, súčet, položky
     zoznamu setov, riadky mimo katalógu ani zoznam „Bez kódov" klikom nerobia
     NIČ — ruka tam sľubuje akciu, ktorá neexistuje (najhoršie pri jantárovom
     riadku, kde používateľ čaká opravu). Tabuľky sekcie preto nesú marker
     `.hwtab` a ruku dostane VÝHRADNE to, čo naozaj reaguje; Kusovník vedľa
     ostáva nedotknutý (to je pôvodné správanie okna Výroba, kde ruku mali
     len `tr.bomrow` a `tr.hwrow`). */
  .bomtab.hwtab tbody tr { cursor: default; }
  .bomtab.hwtab tbody tr:hover { background: none; }
  .bomtab.hwtab tbody tr.hwrow { cursor: pointer; }
  .bomtab.hwtab tbody tr.hwrow:hover { background: var(--nx-select-bg-soft); }

  /* ---------- ŠT-1c PR B1: sekcia ROZPOČET (Š12–Š13) ----------
     Štýly sa PRESUNULI 1:1 z production.html (tab Rozpočet zanikol) — Š12
     zakazuje redizajn obsahu. Dve vedomé úpravy:
       · prepínače DPH a režimu žijú v LIŠTE sekcie (`.sectools .bseg`), takže
         stĺpcový obal `.bswitch` a pätka `.bfoot` zanikli,
       · farby boli a ostávajú VÝHRADNE cez --nx-* tokeny (okno má dve témy).
     Kolízie s triedami Štúdia nie sú: rozpočet kreslí `.btab`, Kusovník
     `.bomtab`; `.totrow`/`.rowact`/`.sectools` rozpočet nepoužíva. */
  .bsum { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
          background: var(--nx-surface); border: 1px solid var(--nx-border);
          border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; }
  .blbl { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--nx-ink-muted); }
  .btotal { font-size: 24px; font-weight: 700; color: var(--nx-ink-title); font-variant-numeric: tabular-nums; }
  .btotal small { font-size: 12px; font-weight: 400; color: var(--nx-ink-muted); }
  .bseg { display: flex; border: 1px solid var(--nx-border-strong); border-radius: 6px;
          overflow: hidden; font-size: 11.5px; flex: 0 0 auto; }
  .bseg button { border: 0; background: var(--nx-surface); padding: 5px 10px; cursor: pointer;
                 color: var(--nx-ink-label); font: inherit; font-size: 11.5px; min-width: 46px; }
  .bseg button + button { border-left: 1px solid var(--nx-border-soft); }
  .bseg button.on { background: var(--nx-select); color: var(--nx-on-accent); font-weight: 600; }
  .bseg.bmode button { font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  .bwarns { margin-left: auto; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .bchip { display: inline-flex; align-items: center; gap: 6px; background: var(--nx-warn-bg);
           border: 1px solid var(--nx-warnchip-border); color: var(--nx-warn-fg);
           border-radius: 6px; padding: 5px 10px; font-size: 11.5px; cursor: pointer;
           font: inherit; text-align: left; }
  .bchip .ic { width: 12px; height: 12px; transition: transform .12s; }
  .bchip.open .ic { transform: rotate(90deg); }
  .blist { background: var(--nx-warn-bg); border: 1px solid var(--nx-warnchip-border);
           border-radius: 8px; padding: 6px 12px; font-size: 11.5px;
           color: var(--nx-warnrow-fg); margin: 0 0 10px; }
  .blist > div { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  .blist .bage { font-variant-numeric: tabular-nums; white-space: nowrap; }

  details.bsec { background: var(--nx-surface); border: 1px solid var(--nx-border);
                 border-radius: 8px; margin: 0 0 8px; overflow: hidden; }
  details.bsec > summary { display: flex; align-items: center; gap: 9px; padding: 7px 12px;
                           flex-wrap: wrap; font-weight: 400; }
  details.bsec > summary h3 { margin: 0; font-size: 11.5px; text-transform: uppercase;
                              letter-spacing: .7px; color: var(--nx-ink-strong); font-weight: 600; }
  .bcnt { font-size: 11px; color: var(--nx-ink-faint); }
  .bsubt { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums;
           color: var(--nx-ink-title); font-size: 13px; }
  .bsubt.off { color: var(--nx-ink-faint); text-decoration: line-through; }
  .bappl { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
           color: var(--nx-ink-label); cursor: pointer; }
  .bappl input { accent-color: var(--nx-select); }

  .btab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .btab th { background: var(--nx-surface-th); color: var(--nx-ink-label); font-weight: 600;
             text-align: left; font-size: 10.5px; padding: 4px 12px;
             border-top: 1px solid var(--nx-border-soft); border-bottom: 1px solid var(--nx-border); }
  .btab td { padding: 3px 10px; border-bottom: 1px solid var(--nx-border-soft); vertical-align: middle; }
  .btab tr:last-child td { border-bottom: 0; }
  .btab th.bnum, .btab td.bnum { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .btab td.bmut, .bmut { color: var(--nx-ink-muted); }
  .bfnt { color: var(--nx-ink-faint); font-size: 11px; }
  .bstrike { text-decoration: line-through; color: var(--nx-ink-faint); margin-right: 6px; }
  .bpen { width: 12px; height: 12px; color: var(--nx-warn-fg); vertical-align: -0.1em; }
  .btab tr.bzero td { color: var(--nx-ink-faint); }
  .btab tr.bmiss td { background: var(--nx-warn-bg); }
  .bmisslbl { color: var(--nx-warn-fg); font-size: 11px; }
