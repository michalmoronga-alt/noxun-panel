<!-- Noxun Engine — okno Katalog kovania (V0.6 C-2). Vanilla JS, slovensky.
     Katalog je GLOBALNY (%APPDATA%); search je VYHRADNE serverovy (Ruby) —
     JS len renderuje vratene poradie. Obsah tabulky stavia hw_catalog.js cez
     DOM API (textContent — XSS vzor demos_diff.js), ovladanie data-action
     delegaciou; inline handlery LEN bez dat. -->
<meta charset="utf-8">
<link rel="stylesheet" href="css/panel.css?v=0.5.32">

<h1>Katalóg kovania</h1>
<p class="sub" id="hwline">…</p>

<div id="hwRoBanner" class="mdbanner mdbanner-ro" style="display:none">
  <svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>
  <span id="hwRoText">…</span>
</div>

<div class="mdbar">
  <div class="mdsearch">
    <svg class="ic mdsearch-ic" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="hwSearch" type="text" placeholder="Hľadať kód, názov, dodávateľa">
  </div>
  <select id="hwCategory" title="Kategória"></select>
  <label class="hwinactive"><input type="checkbox" id="hwInactive"> neaktívne</label>
  <button class="ghostbtn" id="hwNewBtn" data-action="hw-new"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg> Nová položka</button>
</div>

<div id="hwList"></div>

<!-- Formular novej polozky — enum selecty plni JS zo state payloadu. -->
<div id="hwNewForm" style="display:none">
  <div class="row"><label>Kód *</label><input id="hn_code" type="text" placeholder="Demos kód alebo vlastný"><span class="unit"></span></div>
  <div class="row"><label>Názov *</label><input id="hn_name" type="text"><span class="unit"></span></div>
  <div class="row"><label>Kategória</label><select id="hn_category"></select><span class="unit"></span></div>
  <div class="row"><label>MJ</label><select id="hn_unit"></select><span class="unit"></span></div>
  <div class="row"><label>Cena</label><input id="hn_price" type="text" placeholder="nezadaná"><span class="unit">€ s DPH</span></div>
  <div class="row"><label>Dodávateľ</label><input id="hn_supplier" type="text" placeholder="napr. Demos"><span class="unit"></span></div>
  <div class="row"><label>Poznámka</label><input id="hn_notes" type="text"><span class="unit"></span></div>
  <div class="btnrow">
    <button class="primary" data-action="hw-create">Vytvoriť</button>
    <button class="ghostbtn" data-action="hw-new-close">Zrušiť</button>
  </div>
</div>

<!-- Potvrdenie zmazania — in-window modal (NIE UI.messagebox). -->
<div id="hwDelModal" class="nxmodal" style="display:none">
  <div class="nxmodal-card">
    <div class="nxmodal-title">Zmazať položku</div>
    <div class="hint" id="hwDelText">…</div>
    <div class="nxmodal-warn">Zmazanie neruší históriu zákaziek — tie držia vlastné snapshoty. Mapovania dávky D budú mať vlastný guard.</div>
    <div class="btnrow">
      <!-- GH #100 P1: destruktivna akcia = .danger (UI_DIZAJN), nie primary -->
      <button class="danger" data-action="hw-del-confirm">Zmazať</button>
      <button class="ghostbtn" data-action="hw-del-close">Zrušiť</button>
    </div>
  </div>
</div>

<div id="status">Pripravené.</div>

<script src="js/errors.js?v=0.5.32"></script>
<script src="js/icons.js?v=0.5.32"></script>
<script src="js/hw_catalog.js?v=0.5.32"></script>
