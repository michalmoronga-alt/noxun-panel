# tests — headless sada (ruby tests/run_all.rb) na kazdy push a PR.
name: tests

on: [push, pull_request]

jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Headless testy (bez SketchUpu)
        run: ruby tests/run_all.rb
      - name: JS testy (evalDim parser vyrazovych poli)
        run: node tests/js/test_expr.js
      - name: JS testy (klasifikacia klucov meraca D-25)
        run: node tests/js/test_usage.js
      - name: JS testy (stav vkladacej karty D-32/D-33/D-39)
        run: node tests/js/test_insert_state.js
      - name: JS testy (zoskupenie ABS pasok k dekoru D-36)
        run: node tests/js/test_abs_groups.js
      - name: JS testy (dekorove karty katalogu D-41)
        run: node tests/js/test_decor_groups.js
      - name: JS testy (hladanie katalogu D-42)
        run: node tests/js/test_material_search.js
      - name: JS testy (sekcie mriezky dekorov D-42 B)
        run: node tests/js/test_decor_sections.js
      - name: JS testy (hrubkove filtre a labely D-45)
        run: node tests/js/test_thickness_labels.js
      - name: JS testy (format platne pri cipoch + zapamatana sada D-44)
        run: node tests/js/test_decor_formats.js
      - name: JS testy (potvrdzovacia lista projektovej predvolby D-46)
        run: node tests/js/test_proj_confirm.js
      - name: JS testy — abs mirror (2A-3b)
        run: node tests/js/test_abs_mirror.js
