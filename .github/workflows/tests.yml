# tests — headless sada (ruby tests/run_all.rb) na kazdy push a PR.
name: tests

on: [push, pull_request]

jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Headless testy (bez SketchUpu)
        run: ruby tests/run_all.rb
      # Vsetky JS sady globom — rucne vymenovane kroky uz dvakrat zabudli nove
      # sady (D-100/D-102, potom cely blok UI 2.0). Glob novu sadu nikdy nevynecha.
      - name: JS testy — vsetky sady (tests/js/test_*.js)
        run: |
          for f in tests/js/test_*.js; do
            echo "== $f"
            node "$f" || exit 1
          done
